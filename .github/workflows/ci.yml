name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # o passo "Publicar bin/" commita o exe no branch de teste

jobs:
  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable-msvc)
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Testes
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Tamanho do artefato (alvo RNF-01 ≤ 15 MB)
        shell: pwsh
        run: |
          $exe = Get-Item target/release/rustshot.exe
          $mb = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "rustshot.exe: $mb MB"
          if ($exe.Length -gt 15MB) { Write-Warning "Acima do alvo de 15 MB (RNF-01)" }

      - name: Publicar artefato
        uses: actions/upload-artifact@v5
        with:
          name: rustshot-windows-x64
          path: target/release/rustshot.exe

      # Publica o exe em bin/ no próprio branch, para baixar e testar sem
      # release. Restrito ao branch de trabalho; o "[skip ci]" impede que o
      # commit do bot dispare este workflow de novo.
      - name: Publicar bin/ no branch (teste manual)
        if: github.event_name == 'push' && github.ref == 'refs/heads/worktree-issues-1-2-3'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          Copy-Item target/release/rustshot.exe bin/rustshot.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/rustshot.exe
          git commit -m "build: publica bin/rustshot.exe para teste no Windows [skip ci]"
          git push
