[package]
name = "rustshot"
version = "1.6.0"
edition = "2021"
description = "Captura de tela para Windows 11 — tela cheia, região e edição com anotações"
license = "BSD-3-Clause"
repository = "https://github.com/mBarony/printscreen-windows11-rust"
build = "build.rs"

# v1.3 "standalone": além do núcleo GUI (eframe/egui + wgpu, que É a
# plataforma do app e não faz sentido incorporar), tudo o mais é código
# próprio chamando Win32 direto via windows-sys. Substituídos por módulos
# internos: tray-icon/muda/notify-rust/global-hotkey (platform::shell),
# xcap (platform::capture), arboard (platform::clipboard), auto-launch,
# single-instance, rfd, dirs, chrono, simplelog, anyhow, serde/serde_json
# (json.rs), image (imgbuf.rs + jpeg/ vendorizado do image-rs) e tiny-skia
# (editor::raster). O ab_glyph já vem dentro do epaint (egui): usá-lo na
# exportação não adiciona crate novo à árvore.
[dependencies]
# GUI (egui) com renderizador wgpu (D3D12/DXGI no Windows): o backend
# glow (OpenGL) fazia o driver NVIDIA tirar o overlay de tela cheia da
# composição do DWM (unredirection), apagando o monitor por ~1 s.
# Sem "default_fonts": as quatro fontes embutidas do egui (Ubuntu-Light, Hack,
# NotoEmoji, emoji-icon-font) não são usadas — a UI roda na Segoe UI Variable do
# sistema com a Inter embutida como reserva, e os ícones são vetoriais próprios
# (editor::icons). Emoji já não sobrevivia à exportação, que rasteriza com a
# Inter; sem a NotoEmoji no preview, o editor passa a ser WYSIWYG de verdade.
# Sem "accesskit": o adapter carregava o uiautomationcore.dll no boot de toda
# sessão (a árvore de acessibilidade em si só é construída quando um leitor de
# tela se conecta). Decisão consciente de trocar o suporte a NVDA/Narrator pelos
# MB do provedor de UI Automation.
eframe = { version = "0.32", default-features = false, features = ["wgpu"] }
# Backend de plataforma do wgpu (o feature "wgpu" do eframe não habilita
# nenhum): D3D12, o mesmo caminho DXGI/DWM dos apps nativos do Windows.
wgpu = { version = "25", default-features = false, features = ["dx12"] }
# default-features = false pelo mesmo motivo: o default do egui é justamente
# "default_fonts", e a unificação de features do cargo o reativaria para o
# eframe.
egui = { version = "0.32", default-features = false }
ab_glyph = "0.2"           # rasterização de texto na exportação (já é dep. do epaint)
log = "0.4"                # fachada usada também por eframe/wgpu

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# Reconhecimento de texto (`Windows.Media.Ocr`) é WinRT, e o `windows-sys` só
# cobre Win32 clássico. A crate `windows` NÃO é uma dependência nova: ela já
# entra no binário hoje por `eframe -> wgpu -> wgpu-hal -> gpu-allocator`, por
# causa do backend DX12. Aqui só se habilitam os módulos que faltavam — o de
# OCR inteiro tem ~260 linhas, e as features da crate são granulares (um
# `#[cfg]` por submódulo), então nada além disso é compilado.
#
# Regra: `windows-sys` para Win32 clássico; `windows` só onde a API é WinRT.
# Hoje isso quer dizer: só o OCR.
#
# A versão segue a que o wgpu-hal fixa. Ao subir o wgpu, confira se ela mudou:
# duas versões da crate no mesmo binário seriam código duplicado.
windows = { version = "0.58", optional = true, default-features = false, features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Globalization",
    "Foundation_Collections",
    "Storage_Streams",
] }

[features]
# Reconhecimento de texto. Fora do padrão enquanto é protótipo — assim dá para
# medir o custo real no exe comparando `cargo build --release` com
# `cargo build --release --features ocr`, sem editar arquivo nenhum.
ocr = ["dep:windows"]

[build-dependencies]
embed-resource = "3"       # (build) embute ícone + manifesto Per-Monitor V2

[profile.release]
opt-level = 3
# "fat": o binário é pequeno e o build já é curto — vale o inline entre crates
# (menos código morto no exe, menos páginas mapeadas em execução).
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Build scripts/proc-macros do release com flags IDÊNTICAS às do perfil dev:
# com o mesmo -Cmetadata (.cargo/config.toml), o rustc determinístico gera
# binários byte-idênticos aos do debug — que o Smart App Control da máquina
# de build já avaliou e aprovou. Sem isso, cada build release re-sorteia
# vereditos de reputação para ~200 exes intermediários e algum acaba
# bloqueado (os error 4551). Não afeta o rustshot.exe final, só temporários.
[profile.release.build-override]
opt-level = 0
debug = false
debug-assertions = true
overflow-checks = true
strip = "none"
