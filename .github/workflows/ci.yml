name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable-msvc)
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Testes
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Tamanho do artefato (alvo RNF-01 ≤ 15 MB)
        shell: pwsh
        run: |
          $exe = Get-Item target/release/rustshot.exe
          $mb = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "rustshot.exe: $mb MB"
          if ($exe.Length -gt 15MB) { Write-Warning "Acima do alvo de 15 MB (RNF-01)" }

      # Assina uma cópia, nunca o exe em target/: o rust-cache guarda essa
      # pasta, e um binário assinado no cache confundiria builds seguintes.
      - name: Separar o artefato para assinatura
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          Copy-Item target/release/rustshot.exe artifact/rustshot.exe -Force

      # Pushes de fork não recebem segredos: aqui a assinatura é opcional.
      - name: Assinar o executável
        uses: ./.github/actions/sign-windows
        with:
          path: artifact/rustshot.exe
          pfx-base64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          password: ${{ secrets.CODE_SIGN_PASSWORD }}
          required: "false"

      - name: Publicar artefato
        uses: actions/upload-artifact@v5
        with:
          name: rustshot-windows-x64
          path: artifact/rustshot.exe
