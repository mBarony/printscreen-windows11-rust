[package]
name = "rustshot"
version = "1.2.0"
edition = "2021"
description = "Captura de tela para Windows 11 — tela cheia, região e edição com anotações"
license = "BSD-3-Clause"
repository = "https://github.com/mBarony/printscreen-windows11-rust"
build = "build.rs"

[dependencies]
# GUI (egui): editor, overlay, configurações. Renderizador wgpu (D3D12/DXGI
# no Windows): o backend glow (OpenGL) fazia o driver NVIDIA tirar o overlay
# de tela cheia da composição do DWM (unredirection), apagando o monitor por
# ~1 s ao criar/destruir a janela de seleção.
eframe = { version = "0.32", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
] }
# Backend de plataforma do wgpu (o feature "wgpu" do eframe não habilita
# nenhum): D3D12, o mesmo caminho DXGI/DWM dos apps nativos do Windows.
wgpu = { version = "25", default-features = false, features = ["dx12"] }
egui = "0.32"
global-hotkey = "0.7"      # atalhos globais
tray-icon = "0.21"         # bandeja do sistema
xcap = "0.6"               # captura de tela multi-monitor
arboard = "3.5"            # área de transferência (imagem)
image = "0.25"             # JPG, crop, composição
tiny-skia = "0.11"         # rasterização vetorial na exportação
ab_glyph = "0.2"           # rasterização de texto na exportação
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"             # data/hora no nome do arquivo
dirs = "6"                 # pasta Imagens (destino padrão)
rfd = "0.15"               # diálogo nativo de seleção de pasta
notify-rust = "4"          # toasts do Windows
auto-launch = "0.5"        # iniciar com o Windows (HKCU\...\Run)
single-instance = "0.3"    # instância única
anyhow = "1"
log = "0.4"
simplelog = "0.12"         # rustshot.log na pasta do executável

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Build scripts/proc-macros do release com flags IDÊNTICAS às do perfil dev:
# com o mesmo -Cmetadata (.cargo/config.toml), o rustc determinístico gera
# binários byte-idênticos aos do debug — que o Smart App Control da máquina
# de build já avaliou e aprovou. Sem isso, cada build release re-sorteia
# vereditos de reputação para ~200 exes intermediários e algum acaba
# bloqueado (os error 4551). Não afeta o rustshot.exe final, só temporários.
[profile.release.build-override]
opt-level = 0
debug = false
debug-assertions = true
overflow-checks = true
strip = "none"
