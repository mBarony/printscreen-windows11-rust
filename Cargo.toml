[package]
name = "rustshot"
version = "1.4.0"
edition = "2021"
description = "Captura de tela para Windows 11 — tela cheia, região e edição com anotações"
license = "BSD-3-Clause"
repository = "https://github.com/mBarony/printscreen-windows11-rust"
build = "build.rs"

# v1.3 "standalone": além do núcleo GUI (eframe/egui + wgpu, que É a
# plataforma do app e não faz sentido incorporar), tudo o mais é código
# próprio chamando Win32 direto via windows-sys. Substituídos por módulos
# internos: tray-icon/muda/notify-rust/global-hotkey (platform::shell),
# xcap (platform::capture), arboard (platform::clipboard), auto-launch,
# single-instance, rfd, dirs, chrono, simplelog, anyhow, serde/serde_json
# (json.rs), image (imgbuf.rs + jpeg/ vendorizado do image-rs) e tiny-skia
# (editor::raster). O ab_glyph já vem dentro do epaint (egui): usá-lo na
# exportação não adiciona crate novo à árvore.
[dependencies]
# GUI (egui) com renderizador wgpu (D3D12/DXGI no Windows): o backend
# glow (OpenGL) fazia o driver NVIDIA tirar o overlay de tela cheia da
# composição do DWM (unredirection), apagando o monitor por ~1 s.
eframe = { version = "0.32", default-features = false, features = [
    "accesskit",       # acessibilidade (leitores de tela)
    "default_fonts",
    "wgpu",
] }
# Backend de plataforma do wgpu (o feature "wgpu" do eframe não habilita
# nenhum): D3D12, o mesmo caminho DXGI/DWM dos apps nativos do Windows.
wgpu = { version = "25", default-features = false, features = ["dx12"] }
egui = "0.32"
ab_glyph = "0.2"           # rasterização de texto na exportação (já é dep. do epaint)
log = "0.4"                # fachada usada também por eframe/wgpu

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"       # (build) embute ícone + manifesto Per-Monitor V2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Build scripts/proc-macros do release com flags IDÊNTICAS às do perfil dev:
# com o mesmo -Cmetadata (.cargo/config.toml), o rustc determinístico gera
# binários byte-idênticos aos do debug — que o Smart App Control da máquina
# de build já avaliou e aprovou. Sem isso, cada build release re-sorteia
# vereditos de reputação para ~200 exes intermediários e algum acaba
# bloqueado (os error 4551). Não afeta o rustshot.exe final, só temporários.
[profile.release.build-override]
opt-level = 0
debug = false
debug-assertions = true
overflow-checks = true
strip = "none"
